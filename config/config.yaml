project:
  name: inference-budget-study
  description: "Inference-time computation vs. reasoning quality"

dataset:
  name: gsm8k
  config: main
  split: test
  sample_size: 1000
  random_seed: 42

experiment:
  generations_per_question: 50
  inference_budgets: [1, 3, 5, 10, 20, 50]
  shuffle_seed: 42

generation:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512
  seed: null  # null = independent stochastic generations

sheshnag:
  base_url: "${SHESHNAG_BASE_URL}"
  model_id: "${SHESHNAG_MODEL_ID}"

analysis:
  bootstrap_samples: 10000
  confidence_level: 0.95
  bootstrap_seed: 42

paths:
  prompt_template: "prompts/math_reasoning.txt"
  dataset_processed: "data/processed/gsm8k_test_1000.csv"
  dataset_metadata: "data/metadata/dataset_metadata.json"
  batch_output: "batch/generated/sheshnag_batch.jsonl"
  batch_results: "batch/results/"
  results_raw: "results/raw/sheshnag_results.jsonl"
  results_parsed: "results/parsed/generations.csv"
  results_final: "results/final/evaluation.csv"
  results_analysis: "results/analysis/"
  figures: "results/analysis/figures/"
